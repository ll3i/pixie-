  <text class="sans" x="96" y="272" font-size="13" fill="#6B7686">멀티에이전트 체인</text>
  <text class="sans" x="96" y="292" font-size="12" fill="#94A0B0">AI-A &#8594; AI-A2 &#8594; AI-B</text>

  <rect x="360" y="160" width="272" height="168" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="mono" x="384" y="240" font-size="40" font-weight="700" fill="#1454FE">6개</text>
  <text class="sans" x="384" y="272" font-size="13" fill="#6B7686">Blueprint 모듈</text>
  <text class="sans" x="384" y="292" font-size="12" fill="#94A0B0">도메인별 라우팅 분리</text>

  <rect x="648" y="160" width="272" height="168" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="mono" x="672" y="240" font-size="40" font-weight="700" fill="#1454FE">2종</text>
  <text class="sans" x="672" y="272" font-size="13" fill="#6B7686">LLM 프로바이더</text>
  <text class="sans" x="672" y="292" font-size="12" fill="#94A0B0">OpenAI &#8596; CLOVA 폴백</text>

  <rect x="936" y="160" width="272" height="168" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
  <circle cx="982" cy="224" r="22" fill="#1454FE"/>
  <path d="M971 224 l8 8 l15 -17" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans" x="960" y="272" font-size="13" fill="#6B7686">ARIMA-X 예측 엔진</text>
  <text class="sans" x="960" y="292" font-size="12" fill="#94A0B0">뉴스 감성 가중 반영</text>

  <!-- ═ deliverables ═ -->
