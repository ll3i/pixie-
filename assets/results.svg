  <rect x="72" y="402" width="176" height="38" rx="19" fill="#F0F4FF"/>
  <text class="sans" x="160" y="426" font-size="13" font-weight="500" fill="#16314F" text-anchor="middle">투자 성향 6지표 프로필</text>
