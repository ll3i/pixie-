  <!-- ═ footer ═ -->
  <line x1="72" y1="496" x2="1208" y2="496" stroke="#C7CFDA" stroke-width="1"/>
  <text class="mono" x="72" y="522" font-size="12" fill="#94A0B0">repo: pixie- &#183; Flask &#183; LLM chain &#215;3 &#183; Blueprint &#215;6 &#183; OpenAI &#8596; CLOVA &#183; GitHub Pages demo</text>
