  <text class="sans" x="321" y="426" font-size="13" font-weight="500" fill="#16314F" text-anchor="middle">맞춤 상담 챗봇</text>
  <rect x="394" y="402" width="136" height="38" rx="19" fill="#F0F4FF"/>
  <text class="sans" x="462" y="426" font-size="13" font-weight="500" fill="#16314F" text-anchor="middle">주가 예측 리포트</text>
