<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixie system architecture">
  <style>
    .sans { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FB"/>

  <!-- ═ header band ═ -->
  <rect x="72" y="44" width="4" height="34" rx="2" fill="#1454FE"/>
  <text class="mono" x="90" y="57" font-size="13" letter-spacing="3" fill="#1454FE">ARCHITECTURE</text>
  <text class="sans" x="88" y="99" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#161B24">Pixie<tspan fill="#3B7AFF">.</tspan></text>
  <text class="mono" x="1208" y="57" font-size="13" fill="#94A0B0" text-anchor="end">ll3i &#183; pixie-</text>

  <!-- ═ layer: presentation ═ -->
  <rect x="72" y="140" width="1136" height="76" rx="16" fill="#F0F4FF" stroke="#E2E7EE"/>
  <text class="mono" x="88" y="161" font-size="12" letter-spacing="2" fill="#6B7686">PRESENTATION</text>
  <rect x="88" y="170" width="1104" height="36" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="106" y="193" font-size="15" font-weight="600" fill="#161B24">Flask 템플릿</text>
  <text class="sans" x="226" y="193" font-size="12" fill="#6B7686">Jinja2 서버 렌더링 &#183; Bootstrap 5 &#183; Chart.js</text>

  <!-- arrow: presentation → application (gray) -->
  <line x1="640" y1="216" x2="640" y2="229" stroke="#C7CFDA" stroke-width="1.5"/>
  <polygon points="634,229 646,229 640,237" fill="#C7CFDA"/>

  <!-- ═ layer: application ═ -->
  <rect x="72" y="237" width="1136" height="84" rx="16" fill="#F0F4FF" stroke="#E2E7EE"/>
  <text class="mono" x="88" y="258" font-size="12" letter-spacing="2" fill="#6B7686">APPLICATION</text>
  <rect x="88" y="267" width="192" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="mono" x="104" y="285" font-size="14" font-weight="600" fill="#161B24">app.py</text>
  <text class="sans" x="104" y="303" font-size="12" fill="#6B7686">Flask 앱 팩토리</text>
  <rect x="292" y="267" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="362" y="285" font-size="14" font-weight="600" fill="#161B24" text-anchor="middle">auth</text>
  <text class="sans" x="362" y="303" font-size="11" fill="#94A0B0" text-anchor="middle">Blueprint</text>
  <rect x="444" y="267" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="514" y="285" font-size="14" font-weight="600" fill="#161B24" text-anchor="middle">chat</text>
  <text class="sans" x="514" y="303" font-size="11" fill="#94A0B0" text-anchor="middle">Blueprint</text>
  <rect x="596" y="267" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="666" y="285" font-size="14" font-weight="600" fill="#161B24" text-anchor="middle">stock</text>
  <text class="sans" x="666" y="303" font-size="11" fill="#94A0B0" text-anchor="middle">Blueprint</text>
  <rect x="748" y="267" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="818" y="285" font-size="14" font-weight="600" fill="#161B24" text-anchor="middle">news</text>
  <text class="sans" x="818" y="303" font-size="11" fill="#94A0B0" text-anchor="middle">Blueprint</text>
  <rect x="900" y="267" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="970" y="285" font-size="14" font-weight="600" fill="#161B24" text-anchor="middle">learning</text>
  <text class="sans" x="970" y="303" font-size="11" fill="#94A0B0" text-anchor="middle">Blueprint</text>
  <rect x="1052" y="267" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="1122" y="285" font-size="14" font-weight="600" fill="#161B24" text-anchor="middle">alerts</text>
  <text class="sans" x="1122" y="303" font-size="11" fill="#94A0B0" text-anchor="middle">Blueprint</text>

  <!-- arrow: application → service (accent) -->
  <line x1="640" y1="321" x2="640" y2="334" stroke="#1454FE" stroke-width="1.5"/>
  <polygon points="634,334 646,334 640,342" fill="#1454FE"/>

  <!-- ═ layer: service (ink) ═ -->
  <rect x="72" y="342" width="1136" height="110" rx="16" fill="#0B1B33"/>
  <text class="mono" x="88" y="363" font-size="12" letter-spacing="2" fill="#CADBFF">SERVICE LAYER</text>
  <rect x="88" y="372" width="360" height="66" rx="10" fill="#102542" stroke="#16314F"/>
  <text class="sans" x="106" y="394" font-size="15" font-weight="600" fill="#EDF1F7">LLM Service</text>
  <text class="sans" x="106" y="414" font-size="12" fill="#CADBFF">AI-A &#8594; AI-A2 &#8594; AI-B 3단 체인</text>
  <text class="sans" x="106" y="431" font-size="12" fill="#94A0B0">OpenAI &#8596; CLOVA 폴백</text>
  <rect x="460" y="372" width="360" height="66" rx="10" fill="#102542" stroke="#16314F"/>
  <text class="sans" x="478" y="394" font-size="15" font-weight="600" fill="#EDF1F7">예측 엔진</text>
  <text class="sans" x="478" y="414" font-size="12" fill="#CADBFF">ARIMA-X 시계열 예측</text>
  <text class="sans" x="478" y="431" font-size="12" fill="#94A0B0">뉴스 감성 점수 가중</text>
  <rect x="832" y="372" width="360" height="66" rx="10" fill="#102542" stroke="#16314F"/>
  <text class="sans" x="850" y="394" font-size="15" font-weight="600" fill="#EDF1F7">시맨틱 검색</text>
  <text class="sans" x="850" y="414" font-size="12" fill="#CADBFF">KoSBERT 임베딩</text>
  <text class="sans" x="850" y="431" font-size="12" fill="#94A0B0">FAISS 벡터 인덱스</text>

  <!-- arrow: service → data (accent) -->
  <line x1="640" y1="452" x2="640" y2="465" stroke="#1454FE" stroke-width="1.5"/>
  <polygon points="634,465 646,465 640,473" fill="#1454FE"/>

  <!-- ═ layer: data ═ -->
  <rect x="72" y="473" width="1136" height="98" rx="16" fill="#F0F4FF" stroke="#E2E7EE"/>
  <text class="mono" x="88" y="494" font-size="12" letter-spacing="2" fill="#6B7686">DATA</text>
  <rect x="88" y="503" width="267" height="56" rx="10" fill="#FFFFFF" stroke="#C7CFDA" stroke-dasharray="5 4"/>
  <text class="sans" x="104" y="525" font-size="15" font-weight="600" fill="#161B24">Supabase</text>
  <text class="sans" x="104" y="545" font-size="12" fill="#6B7686">외부 DB &#183; 이중 저장소</text>
  <rect x="367" y="503" width="267" height="56" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="383" y="525" font-size="15" font-weight="600" fill="#161B24">SQLite</text>
  <text class="sans" x="383" y="545" font-size="12" fill="#6B7686">로컬 폴백 &#183; 이중 저장소</text>
  <rect x="646" y="503" width="267" height="56" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="662" y="525" font-size="15" font-weight="600" fill="#161B24">한국 주식 CSV</text>
  <text class="sans" x="662" y="545" font-size="12" fill="#6B7686">가격 &#183; 재무 &#183; 섹터</text>
  <rect x="925" y="503" width="267" height="56" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="941" y="525" font-size="15" font-weight="600" fill="#161B24">APScheduler</text>
  <text class="sans" x="941" y="545" font-size="12" fill="#6B7686">뉴스 주기 수집</text>

  <!-- ═ layer: deploy ═ -->
  <rect x="72" y="584" width="1136" height="72" rx="16" fill="#F0F3F7" stroke="#E2E7EE"/>
  <text class="mono" x="88" y="604" font-size="12" letter-spacing="2" fill="#6B7686">DEPLOY</text>
  <rect x="88" y="612" width="1104" height="32" rx="10" fill="#FFFFFF" stroke="#E2E7EE"/>
  <text class="sans" x="106" y="633" font-size="15" font-weight="600" fill="#161B24">Vercel</text>
  <text class="mono" x="176" y="632" font-size="12" fill="#6B7686">@vercel/python &#183; gunicorn</text>

  <!-- ═ footer ═ -->
  <line x1="72" y1="680" x2="1208" y2="680" stroke="#C7CFDA" stroke-width="1"/>
  <text class="mono" x="72" y="703" font-size="12" fill="#94A0B0">Python &#183; Flask &#183; OpenAI API &#183; CLOVA Studio &#183; ARIMA-X &#183; KoSBERT &#183; FAISS &#183; Supabase &#183; SQLite &#183; APScheduler &#183; Vercel</text>
</svg>
